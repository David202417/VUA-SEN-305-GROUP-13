<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Biodata Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Student Biodata Form</h1>
    <p>Please fill in your personal and academic information.</p>

    <form action="#" method="post">
      <h2>Personal Information</h2>

      <label for="studentID">Student ID:</label>
      <input type="text" id="studentID" name="studentID" required />
      <br /><br />

      <label for="firstName">First Name:</label>
      <input type="text" id="firstName" name="firstName" required />
      <br /><br />

      <label for="lastName">Last Name:</label>
      <input type="text" id="lastName" name="lastName" required />
      <br /><br />

      <label for="middleName">Middle Name:</label>
      <input type="text" id="middleName" name="middleName" />
      <br /><br />

      <label for="dob">Date of Birth:</label>
      <input type="date" id="dob" name="dob" required />
      <br /><br />

      <label for="gender">Gender:</label>
      <select id="gender" name="gender" required>
        <option value="">Select Gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
      </select>
      <br /><br />

      <label for="email">Email Address:</label>
      <input type="email" id="email" name="email" required />
      <br /><br />

      <label for="phone">Phone Number:</label>
      <input type="tel" id="phone" name="phone" required />
      <br /><br />

      <label for="address">Home Address:</label>
      <textarea
        id="address"
        name="address"
        rows="4"
        cols="30"
        required
      ></textarea>
      <br /><br />

      <label for="state">State of Origin:</label>
      <input type="text" id="state" name="state" required />
      <br /><br />

      <label for="nationality">Nationality:</label>
      <input type="text" id="nationality" name="nationality" required />
      <br /><br />

      <h2>Academic Information</h2>

      <label for="department">Department:</label>
      <input type="text" id="department" name="department" required />
      <br /><br />

      <label for="faculty">Faculty:</label>
      <input type="text" id="faculty" name="faculty" required />
      <br /><br />

      <label for="course">Course of Study:</label>
      <input type="text" id="course" name="course" required />
      <br /><br />

      <label for="level">Level:</label>
      <select id="level" name="level" required>
        <option value="">Select Level</option>
        <option value="100">100 Level</option>
        <option value="200">200 Level</option>
        <option value="300">300 Level</option>
        <option value="400">400 Level</option>
        <option value="500">500 Level</option>
        <option value="600">600 Level</option>
      </select>
      <br /><br />

      <label for="admissionYear">Admission Year:</label>
      <input
        type="number"
        id="admissionYear"
        name="admissionYear"
        min="1900"
        max="2100"
        required
      />
      <br /><br />

      <label for="registrationDate">Date of Registration:</label>
      <input
        type="date"
        id="registrationDate"
        name="registrationDate"
        required
      />
      <br /><br />

      <h2>Guardian Information</h2>

      <label for="guardianName">Guardian's Name:</label>
      <input type="text" id="guardianName" name="guardianName" required />
      <br /><br />

      <label for="guardianPhone">Guardian's Phone Number:</label>
      <input type="tel" id="guardianPhone" name="guardianPhone" required />
      <br /><br />

      <h2>Emergency Contact Information</h2>

      <label for="emergencyContact">Emergency Contact:</label>
      <input
        type="tel"
        id="emergencyContact"
        name="emergencyContact"
        required
      />
      <br /><br />

      <input type="submit" value="Submit" />
      <input type="reset" value="Clear Form" />
    </form>

    <script src="script.js"></script>
  </body>
</html>
