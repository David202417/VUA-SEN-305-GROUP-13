<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Create student account</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <a class="brand" href="index.php" aria-label="Student Portal home">
          <span class="brand-mark" aria-hidden="true">S</span>
          <span>Student Portal</span>
        </a>
        <a class="text-link" href="Login.html">Already registered? Log in</a>
      </header>

      <section class="form-card form-card--wide" aria-labelledby="page-title">
        <div class="form-heading">
          <span class="eyebrow">Student registration</span>
          <h1 id="page-title">Create your student account</h1>
          <p>Enter your personal, academic, and contact information below.</p>
        </div>

        <div id="page-message" class="notice" role="alert" hidden></div>

        <form id="registration-form" action="register.php" method="post">
          <fieldset>
            <legend>Account details</legend>
            <div class="field-grid">
              <div class="field">
                <label for="studentID">Student ID</label>
                <input
                  id="studentID"
                  name="studentID"
                  type="text"
                  placeholder="VUG/SEN/25/12345"
                  autocomplete="username"
                  maxlength="16"
                  pattern="VUG/SEN/[0-9]{2}/[0-9]{5}"
                  required
                />
              </div>

              <div class="field">
                <label for="email">Email address</label>
                <input
                  id="email"
                  name="email"
                  type="email"
                  autocomplete="email"
                  placeholder="you@example.com"
                  maxlength="254"
                  required
                />
              </div>

              <div class="field">
                <label for="password">Password</label>
                <input
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="new-password"
                  minlength="8"
                  maxlength="72"
                  placeholder="At least 8 characters"
                  required
                />
              </div>

              <div class="field">
                <label for="confirmPassword">Confirm password</label>
                <input
                  id="confirmPassword"
                  name="confirmPassword"
                  type="password"
                  autocomplete="new-password"
                  minlength="8"
                  maxlength="72"
                  placeholder="Re-enter your password"
                  required
                />
              </div>
            </div>
          </fieldset>

          <fieldset>
            <legend>Personal information</legend>
            <div class="field-grid">
              <div class="field">
                <label for="firstName">First name</label>
                <input id="firstName" name="firstName" type="text" autocomplete="given-name" maxlength="80" required />
              </div>
              <div class="field">
                <label for="lastName">Last name</label>
                <input id="lastName" name="lastName" type="text" autocomplete="family-name" maxlength="80" required />
              </div>
              <div class="field">
                <label for="middleName">Middle name <span class="optional">Optional</span></label>
                <input id="middleName" name="middleName" type="text" autocomplete="additional-name" maxlength="80" />
              </div>
              <div class="field">
                <label for="dob">Date of birth</label>
                <input id="dob" name="dob" type="date" autocomplete="bday" required />
              </div>
              <div class="field">
                <label for="gender">Gender</label>
                <select id="gender" name="gender" required>
                  <option value="">Select gender</option>
                  <option value="male">Male</option>
                  <option value="female">Female</option>
                  <option value="other">Other</option>
                  <option value="prefer-not-to-say">Prefer not to say</option>
                </select>
              </div>
              <div class="field">
                <label for="phone">Phone number</label>
                <input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="20" placeholder="+234 800 000 0000" required />
              </div>
              <div class="field field--full">
                <label for="address">Home address</label>
                <textarea id="address" name="address" rows="3" autocomplete="street-address" maxlength="300" required></textarea>
              </div>
              <div class="field">
                <label for="state">State of origin</label>
                <input id="state" name="state" type="text" autocomplete="address-level1" maxlength="80" required />
              </div>
              <div class="field">
                <label for="nationality">Nationality</label>
                <input id="nationality" name="nationality" type="text" autocomplete="country-name" maxlength="80" required />
              </div>
            </div>
          </fieldset>

          <fieldset>
            <legend>Academic information</legend>
            <div class="field-grid">
              <div class="field">
                <label for="department">Department</label>
                <input id="department" name="department" type="text" maxlength="120" required />
              </div>
              <div class="field">
                <label for="faculty">Faculty</label>
                <input id="faculty" name="faculty" type="text" maxlength="120" required />
              </div>
              <div class="field">
                <label for="course">Course of study</label>
                <input id="course" name="course" type="text" maxlength="120" required />
              </div>
              <div class="field">
                <label for="level">Level</label>
                <select id="level" name="level" required>
                  <option value="">Select level</option>
                  <option value="100">100 Level</option>
                  <option value="200">200 Level</option>
                  <option value="300">300 Level</option>
                  <option value="400">400 Level</option>
                  <option value="500">500 Level</option>
                  <option value="600">600 Level</option>
                </select>
              </div>
              <div class="field">
                <label for="admissionYear">Admission year</label>
                <input id="admissionYear" name="admissionYear" type="number" min="1990" max="2100" inputmode="numeric" required />
              </div>
              <div class="field">
                <label for="registrationDate">Registration date</label>
                <input id="registrationDate" name="registrationDate" type="date" required />
              </div>
            </div>
          </fieldset>

          <fieldset>
            <legend>Guardian and emergency contact</legend>
            <div class="field-grid">
              <div class="field">
                <label for="guardianName">Guardian's name</label>
                <input id="guardianName" name="guardianName" type="text" maxlength="120" required />
              </div>
              <div class="field">
                <label for="guardianPhone">Guardian's phone</label>
                <input id="guardianPhone" name="guardianPhone" type="tel" maxlength="20" required />
              </div>
              <div class="field field--full">
                <label for="emergencyContact">Emergency contact number</label>
                <input id="emergencyContact" name="emergencyContact" type="tel" maxlength="20" required />
              </div>
            </div>
          </fieldset>

          <div class="form-actions">
            <button class="button button--primary" type="submit">Create account</button>
            <button class="button button--secondary" type="reset">Clear form</button>
          </div>
          <p class="form-footnote">Your password is stored securely as a one-way hash.</p>
        </form>
      </section>
    </main>

    <script src="Validate.js" defer></script>
  </body>
</html>
